name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feature/relay-v2]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check Go formatting
        run: make fmt-check

      - name: Vet Go
        run: go vet ./...

      - name: Test Go
        run: go test ./... -count=1

  race:
    name: Targeted Linux race tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Race targeted stateful packages
        run: make test-race

  consumers:
    name: Consumer build check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      GOCACHE: /tmp/convo-relay-consumer-go-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.x

      - name: Build and vet consumers
        run: bash scripts/check-consumers.sh

  release-gate:
    name: Release gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Release compilation and provider gates
        run: make release-gate

      - name: Smoke package layout
        run: make package
