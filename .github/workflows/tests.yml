name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feature/relay-v2]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Vet Go
        run: go vet ./...

      - name: Test Go
        run: go test ./... -count=1

      - name: Test without optional recipe defaults
        run: make test-without-optional-defaults

      - name: Smoke fake provider matrix
        run: make smoke-fake-providers

      - name: Smoke package layout
        run: make package

      - name: Smoke skill install plan
        run: go run ./cmd/convo-relay install-skills --plan --json --install-root /tmp/relay-skill-stage

      - name: Smoke delegated tool install
        run: ./install-skill.sh --install --target tools --json --install-root /tmp/relay-tool-stage

      - name: Smoke display help
        run: go run ./cmd/convo-relay display --help

  race:
    name: Targeted Linux race tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Race targeted stateful packages
        run: make test-race

  cross-compile:
    name: Darwin and Windows cross-compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Cross-compile production packages
        run: make cross-compile

      - name: Cross-compile test packages
        run: make cross-compile-tests
