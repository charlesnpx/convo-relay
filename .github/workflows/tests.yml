name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feature/relay-v2]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check Go formatting
        run: make fmt-check

      - name: Vet Go
        run: go vet ./...

      - name: Test Go
        run: go test ./... -count=1

  race:
    name: Targeted Linux race tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Race targeted stateful packages
        run: make test-race

  release-gate:
    name: Release gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Release compilation and provider gates
        run: make release-gate

      - name: Smoke package layout
        run: make package

      - name: Smoke skill install plan
        run: go run ./cmd/convo-relay install-skills --plan --json --install-root /tmp/relay-skill-stage

      - name: Smoke delegated tool install
        run: ./install-skill.sh --install --target tools --json --install-root /tmp/relay-tool-stage

      - name: Smoke display help
        run: go run ./cmd/convo-relay display --help
